<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprobador de Velocidad de Escritura (Typing Test)</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f3f4f6;
      --text-muted: #6b7280;
      --correct: #10b981;
      --incorrect: #ef4444;
      --current-char: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Tablero de Métricas */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.2rem;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    /* Caja de Texto */
    .typing-box {
      position: relative;
      background-color: #030712;
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      min-height: 160px;
      margin-bottom: 1.5rem;
      cursor: text;
      transition: border-color 0.2s ease;
    }

    .typing-box:focus-within {
      border-color: var(--accent);
    }

    .text-display {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 1.25rem;
      line-height: 1.8;
      letter-spacing: 0.5px;
      user-select: none;
      word-break: break-word;
    }

    .char {
      position: relative;
      color: #4b5563;
      transition: color 0.1s ease;
    }

    .char.correct {
      color: var(--correct);
    }

    .char.incorrect {
      color: var(--incorrect);
      background-color: rgba(239, 68, 68, 0.2);
      border-radius: 2px;
    }

    .char.current {
      color: var(--current-char);
      text-decoration: underline;
      text-decoration-thickness: 2px;
    }

    /* Input oculto pero accesible */
    .hidden-input {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      pointer-events: auto;
      width: 100%;
      height: 100%;
      cursor: default;
    }

    /* Controles */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .time-selector {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .time-selector span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-time {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-time.active {
      background: var(--accent);
      color: #0b0f19;
      border-color: var(--accent);
    }

    .btn-action {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: var(--accent-hover);
    }

    /* Modal de Resultados */
    .results-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .results-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2.5rem;
      text-align: center;
      max-width: 450px;
      width: 90%;
      animation: popup 0.3s ease-out;
    }

    @keyframes popup {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .results-title {
      color: var(--accent);
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .result-item {
      background: #1e293b;
      padding: 1rem;
      border-radius: 10px;
    }

    .result-val {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .result-lbl {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    @media (max-width: 600px) {
      .stats-bar {
        grid-template-columns: repeat(2, 1fr);
      }
      .container {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Velocímetro de Escritura</h1>
      <p class="subtitle">Escribe el texto con la mayor rapidez y precisión posible antes de que termine el tiempo.</p>
    </header>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="timer">60</div>
        <div class="stat-label">Tiempo (s)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="wpm">0</div>
        <div class="stat-label">PPM (WPM)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="accuracy">100%</div>
        <div class="stat-label">Precisión</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="mistakes">0</div>
        <div class="stat-label">Errores</div>
      </div>
    </div>

    <div class="typing-box" onclick="focusInput()">
      <div class="text-display" id="textDisplay"></div>
      <input type="text" class="hidden-input" id="charInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>

    <div class="controls">
      <div class="time-selector">
        <span>Duración:</span>
        <button class="btn-time" onclick="setTime(30, this)">30s</button>
        <button class="btn-time active" onclick="setTime(60, this)">60s</button>
        <button class="btn-time" onclick="setTime(120, this)">120s</button>
      </div>

      <button class="btn-action" onclick="resetTest()">Reiniciar Prueba</button>
    </div>
  </div>

  <div class="results-overlay" id="resultsModal">
    <div class="results-card">
      <h2 class="results-title">¡Prueba Finalizada!</h2>
      <div class="results-grid">
        <div class="result-item">
          <div class="result-val" id="finalWpm">0</div>
          <div class="result-lbl">Palabras / Minuto</div>
        </div>
        <div class="result-item">
          <div class="result-val" id="finalAccuracy">0%</div>
          <div class="result-lbl">Precisión</div>
        </div>
        <div class="result-item">
          <div class="result-val" id="finalChars">0</div>
          <div class="result-lbl">Caracteres Netos</div>
        </div>
        <div class="result-item">
          <div class="result-val" id="finalMistakes">0</div>
          <div class="result-lbl">Errores Cometidos</div>
        </div>
      </div>
      <button class="btn-action" style="width: 100%; justify-content: center;" onclick="closeModalAndReset()">Probar de Nuevo</button>
    </div>
  </div>

  <script>
    // Párrafos en español optimizados para pruebas de velocidad
    const paragraphs = [
      "El exito de cualquier proyecto empresarial se basa en la disciplina constante y la capacidad de adaptarse a los cambios del entorno digital. Aprender habilidades practicas permite crear herramientas independientes y rentables.",
      "La programacion web moderna ofrece infinitas posibilidades para optimizar flujos de trabajo, automatizar reportes financieros y procesar datos con gran velocidad. Mantener la concentracion al escribir codigo agiliza el desarrollo de soluciones.",
      "La planificacion estrategica y el control de inventarios son pilares basicos en la administracion comercial. Toda empresa necesita procesos claros, medicion de resultados continuos y una comunicacion efectiva entre sus colaboradores.",
      "El desarrollo continuo de software requiere paciencia, analisis logico y una comprension solida de las estructuras de datos. Cada linea escrita representa un paso adelante hacia la creacion de plataformas robustas y eficientes."
    ];

    // Variables de Estado
    let maxTime = 60;
    let timeLeft = maxTime;
    let timer = null;
    let isTyping = false;
    let charIndex = 0;
    let mistakes = 0;
    let totalTyped = 0;

    // Elementos DOM
    const textDisplay = document.getElementById('textDisplay');
    const charInput = document.getElementById('charInput');
    const timerTag = document.getElementById('timer');
    const wpmTag = document.getElementById('wpm');
    const accuracyTag = document.getElementById('accuracy');
    const mistakesTag = document.getElementById('mistakes');
    const resultsModal = document.getElementById('resultsModal');

    // Cargar nuevo párrafo con caracteres individuales
    function loadParagraph() {
      const randomIndex = Math.floor(Math.random() * paragraphs.length);
      textDisplay.innerHTML = "";
      paragraphs[randomIndex].split("").forEach(char => {
        const span = document.createElement("span");
        span.innerText = char;
        span.className = "char";
        textDisplay.appendChild(span);
      });
      // Marcar primer caracter activo
      if(textDisplay.firstChild) {
        textDisplay.firstChild.classList.add("current");
      }
    }

    function focusInput() {
      charInput.focus();
    }

    // Manejo de escritura
    function initTyping(e) {
      const characters = textDisplay.querySelectorAll('.char');
      const typedChar = charInput.value.slice(-1);

      // Iniciar temporizador con la primera pulsación
      if (!isTyping && timeLeft > 0) {
        timer = setInterval(updateTimer, 1000);
        isTyping = true;
      }

      // Manejo de retroceso (Backspace)
      if (e.inputType === "deleteContentBackward") {
        if (charIndex > 0) {
          characters[charIndex].classList.remove('current');
          charIndex--;
          if (characters[charIndex].classList.contains('incorrect')) {
            mistakes--;
          }
          characters[charIndex].classList.remove('correct', 'incorrect');
          characters[charIndex].classList.add('current');
          totalTyped = Math.max(0, totalTyped - 1);
        }
      } else if (charIndex < characters.length) {
        totalTyped++;
        // Comparación de caracteres
        if (characters[charIndex].innerText === typedChar) {
          characters[charIndex].classList.add('correct');
        } else {
          mistakes++;
          characters[charIndex].classList.add('incorrect');
        }

        characters[charIndex].classList.remove('current');
        charIndex++;

        // Avanzar cursor visual
        if (charIndex < characters.length) {
          characters[charIndex].classList.add('current');
        } else {
          // Si termina el párrafo antes del tiempo, cargar otro
          loadParagraph();
          charIndex = 0;
        }
      }

      calculateMetrics();
    }

    // Cálculo de WPM y Precisión
    function calculateMetrics() {
      const timeSpent = maxTime - timeLeft;
      
      // Cálculo estándar: 1 palabra = 5 caracteres
      const correctChars = totalTyped - mistakes;
      const words = correctChars / 5;
      const minutes = timeSpent > 0 ? timeSpent / 60 : 1 / 60;
      
      let wpm = Math.round(words / minutes);
      wpm = (wpm < 0 || !wpm || wpm === Infinity) ? 0 : wpm;

      let accuracy = 100;
      if (totalTyped > 0) {
        accuracy = Math.round(((totalTyped - mistakes) / totalTyped) * 100);
        accuracy = accuracy < 0 ? 0 : accuracy;
      }

      // Actualizar UI
      wpmTag.innerText = wpm;
      accuracyTag.innerText = `${accuracy}%`;
      mistakesTag.innerText = mistakes;
    }

    // Cronómetro
    function updateTimer() {
      if (timeLeft > 0) {
        timeLeft--;
        timerTag.innerText = timeLeft;
        calculateMetrics();
      } else {
        clearInterval(timer);
        finishTest();
      }
    }

    // Finalizar prueba y mostrar modal
    function finishTest() {
      charInput.blur();
      isTyping = false;

      const timeSpent = maxTime;
      const correctChars = totalTyped - mistakes;
      const words = correctChars / 5;
      const minutes = timeSpent / 60;
      let wpm = Math.round(words / minutes);
      wpm = (wpm < 0 || !wpm || wpm === Infinity) ? 0 : wpm;

      let accuracy = 100;
      if (totalTyped > 0) {
        accuracy = Math.round(((totalTyped - mistakes) / totalTyped) * 100);
      }

      document.getElementById('finalWpm').innerText = wpm;
      document.getElementById('finalAccuracy').innerText = `${accuracy}%`;
      document.getElementById('finalChars').innerText = correctChars > 0 ? correctChars : 0;
      document.getElementById('finalMistakes').innerText = mistakes;

      resultsModal.style.display = "flex";
    }

    // Ajustar duración
    function setTime(seconds, button) {
      maxTime = seconds;
      document.querySelectorAll('.btn-time').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      resetTest();
    }

    // Resetear prueba
    function resetTest() {
      clearInterval(timer);
      timeLeft = maxTime;
      charIndex = 0;
      mistakes = 0;
      totalTyped = 0;
      isTyping = false;
      charInput.value = "";
      
      timerTag.innerText = timeLeft;
      wpmTag.innerText = "0";
      accuracyTag.innerText = "100%";
      mistakesTag.innerText = "0";
      
      loadParagraph();
      focusInput();
    }

    function closeModalAndReset() {
      resultsModal.style.display = "none";
      resetTest();
    }

    // Event Listeners
    charInput.addEventListener("input", initTyping);
    window.addEventListener("load", () => {
      loadParagraph();
      focusInput();
    });
  </script>
</body>
</html>
